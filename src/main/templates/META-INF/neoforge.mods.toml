    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2.12,20)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
